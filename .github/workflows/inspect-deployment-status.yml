name: Inspect deployment status

on:
  deployment_status:

permissions: {}

jobs:
  inspect:
    name: Inspect deployment status
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_STATUS_STATE: ${{ github.event.deployment_status.state }}
      DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
      DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
      DEPLOYMENT_REF: ${{ github.event.deployment.ref }}
      DEPLOYMENT_STATUS_ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
      WORKFLOW_EVENT_SHA: ${{ github.sha }}
    steps:
      - name: Log safe deployment metadata
        run: |
          printf 'deployment_status.state=%s\n' "$DEPLOYMENT_STATUS_STATE"
          printf 'deployment.environment=%s\n' "$DEPLOYMENT_ENVIRONMENT"
          printf 'deployment.sha=%s\n' "$DEPLOYMENT_SHA"
          printf 'deployment.ref=%s\n' "$DEPLOYMENT_REF"
          printf 'deployment_status.environment_url=%s\n' "$DEPLOYMENT_STATUS_ENVIRONMENT_URL"
          printf 'github.sha=%s\n' "$WORKFLOW_EVENT_SHA"
