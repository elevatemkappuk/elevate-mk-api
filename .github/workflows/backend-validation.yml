name: Backend validation

on:
  pull_request:
    branches:
      - staging
      - master
  push:
    branches:
      - staging
      - master

permissions:
  contents: read

jobs:
  validation:
    name: Backend validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: elevate_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elevate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-placeholder
      DJANGO_DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: elevate_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      SECURE_SSL_REDIRECT: "False"
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      CSRF_TRUSTED_ORIGINS: http://localhost:4200
      CRM_FRONTEND_URL: http://localhost:4200

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: OpenAPI schema validation
        run: python manage.py spectacular --validate --file "$RUNNER_TEMP/openapi-schema.yml"

      - name: Fast backend contract tests
        run: >-
          python manage.py test
          accounts.tests.AuthenticationApiTests
          staff_access.tests.StaffPermissionTests
          marketing_preferences.tests.MarketingPreferenceServiceTests.test_meaningful_opt_out_and_later_opt_in_queue_one_job_per_history_event
          brevo_marketing.tests.BrevoSyncJobTests.test_worker_processes_brevo_job_and_completes_business_outcomes
          brevo_marketing.tests.BrevoMarketingWebhookTests.test_authenticated_unsubscribe_records_brevo_opt_out_without_echo_job
          marketing_preferences.test_audience_preview.AudiencePreviewApiTests.test_authorization_matches_people_read_access
          community.tests.CommunityJoinApiTests
          community.activation_tests.CommunityActivationApiTests
          community.password_reset_tests.CommunityPasswordResetRequestTests
          community.password_reset_tests.CommunityPasswordResetConfirmTests
          # Community Account Management V1 representative invariants.
          community.account_tests.CommunityAccountSummaryTests.test_returns_canonical_email_masked_mobile_and_configured_password
          community.account_tests.CommunityAccountSummaryTests.test_ineligible_authenticated_account_is_rejected
          community.account_password_tests.CommunityAccountPasswordApiTests.test_valid_change_updates_hash_preserves_session_and_audits_without_secrets
          community.account_mobile_tests.CommunityAccountMobileApiTests.test_genuine_add_change_and_removal_audit_and_enqueue_profile_sync
          community.account_mobile_tests.CommunityAccountMobileApiTests.test_collision_with_e164_or_legacy_equivalent_mobile_is_blocked_safely
          community.account_marketing_tests.CommunityAccountMarketingPreferenceApiTests.test_unknown_to_true_is_opted_in_with_authoritative_summary_and_side_effects
          community.account_marketing_tests.CommunityAccountMarketingPreferenceApiTests.test_unknown_to_false_is_opted_out_without_page_load_mutation
          community.account_marketing_tests.CommunityAccountMarketingPreferenceApiTests.test_repeated_same_state_is_idempotent_for_same_self_service_actor
          community.account_email_change_tests.CommunityAccountEmailChangeApiTests.test_inconsistent_identity_and_all_person_user_collisions_are_generic
          community.account_email_change_tests.CommunityAccountEmailChangeApiTests.test_valid_request_is_normalized_durable_and_does_not_change_identity
          community.email_change_verification_tests.CommunityEmailChangeVerificationApiTests.test_valid_logged_out_verification_updates_both_identities_and_queues_durable_work
          community.email_change_verification_tests.CommunityEmailChangeVerificationApiTests.test_authenticated_verification_logs_out_current_session_without_auto_login
          community.email_change_verification_tests.CommunityEmailChangeVerificationApiTests.test_completion_does_not_call_provider_and_security_job_uses_only_safe_params
          notifications.worker_tests.TransactionalEmailWorkerTests.test_generic_provider_failure_becomes_delivery_uncertain
          community.profile_tests.CommunityProfileApiTests
          community.directory_tests.CommunityDirectoryApiTests.test_list_projects_viewer_relative_relationship_states_and_self_is_not_connectable
          community.directory_tests.CommunityDirectoryApiTests.test_relationship_projection_does_not_add_one_query_per_returned_member
          community.directory_tests.CommunityDirectoryApiTests.test_search_filters_pagination_and_invalid_taxonomy
          community.connection_tests.CommunityConnectionApiTests.test_public_contact_flags_are_independent_and_connection_only_contact_is_removed
          community.connection_tests.CommunityConnectionApiTests.test_hidden_accepted_profile_is_available_only_to_connection
          community.connection_tests.CommunityConnectionApiTests.test_self_hidden_and_ineligible_targets_are_rejected
          community.connection_tests.CommunityConnectionApiTests.test_detail_relationship_states_and_contact_privacy
          community.connection_tests.CommunityConnectionApiTests.test_pending_declined_and_disconnected_relationships_do_not_grant_hidden_access
          --noinput -v 1
        # Keep this as a fast representative gate; the full backend suite runs
        # separately on master pull requests and manual dispatch.
