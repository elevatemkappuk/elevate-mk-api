name: Backend validation

on:
  pull_request:
    branches:
      - staging
      - master
  push:
    branches:
      - staging
      - master

permissions:
  contents: read

jobs:
  validation:
    name: Backend validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: elevate_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elevate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-placeholder
      DJANGO_DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: elevate_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      SECURE_SSL_REDIRECT: "False"
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      CSRF_TRUSTED_ORIGINS: http://localhost:4200
      CRM_FRONTEND_URL: http://localhost:4200

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: OpenAPI schema validation
        run: python manage.py spectacular --validate --file "$RUNNER_TEMP/openapi-schema.yml"

      - name: Fast backend contract tests
        run: >-
          python manage.py test
          accounts.tests.AuthenticationApiTests
          staff_access.tests.StaffPermissionTests
          marketing_preferences.tests.MarketingPreferenceServiceTests.test_meaningful_opt_out_and_later_opt_in_queue_one_job_per_history_event
          brevo_marketing.tests.BrevoSyncJobTests.test_worker_processes_brevo_job_and_completes_business_outcomes
          brevo_marketing.tests.BrevoMarketingWebhookTests.test_authenticated_unsubscribe_records_brevo_opt_out_without_echo_job
          marketing_preferences.test_audience_preview.AudiencePreviewApiTests.test_authorization_matches_people_read_access
          --noinput -v 1
        # Intentionally limited deployment-contract coverage; this does not replace
        # the full backend test suite, which will be implemented separately.
